name: Actualizar NDVI Automatico

on:
  schedule:
    - cron: '0 8 * * 1' # Todos los lunes a las 08:00 AM UTC
  workflow_dispatch:    # Permite ejecutarlo a mano cuando quieras

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de actualización de NDVI
        run: |
          # Aquí puedes incluir tu lógica o script para recalcular los CSV
          python -c "print('Procesando datos agrícolas para Mendoza...')"
          
          # Ejemplo de actualización simulada sobre tus archivos reales para que veas el commit automático:
          echo "Actualizado,$(date +%Y-%m-%d)" >> NDVI_Mendoza.csv

      - name: Guardar y sincronizar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🌾 Actualización automática de planillas NDVI y Clima"
          file_pattern: "*.csv"
