<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sismos Geolocalizados</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:10px;
}

.card{
    background:white;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.mendoza{
    border-left:5px solid #dc2626;
}

.otro{
    border-left:5px solid #2563eb;
}

.nombre{
    font-size:16px;
    font-weight:bold;
}

.dato{
    margin-top:4px;
    color:#444;
}
</style>
</head>
<body>

<h2>Sismos INPRES Geolocalizados</h2>

<div id="contenido">
Cargando...
</div>

<script>

const API =
[
 "https://",
 "inpres-proxy",
 ".elexpreso17.workers.dev"
].join("");

async function obtenerLugar(lat, lon){

    try{

        const url =
        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;

        const r = await fetch(url);

        const data = await r.json();

        return data.display_name || "Ubicación desconocida";

    }
    catch{

        return "Ubicación no disponible";
    }
}

async function cargar(){

    const resp = await fetch(API);

    const xmlText = await resp.text();

    const xml =
    new DOMParser()
    .parseFromString(xmlText,"text/xml");

    const items =
    xml.querySelectorAll("item");

    let html = "";

    for(let i=0;i<Math.min(items.length,10);i++){

        const item = items[i];

        const prov =
        item.querySelector("prov").textContent;

        const lat =
        item.querySelector("latitud").textContent;

        const lon =
        item.querySelector("longitud").textContent;

        const mag =
        item.querySelector("mg").textContent;

        const prof =
        item.querySelector("prof").textContent;

        const fecha =
        item.querySelector("fecha").textContent;

        const hora =
        item.querySelector("hora").textContent;

        const lugar =
        await obtenerLugar(lat,lon);

        const clase =
        prov === "MENDOZA"
        ? "card mendoza"
        : "card otro";

        html += `
        <div class="${clase}">
            <div class="nombre">
                ${prov}
            </div>

            <div class="dato">
                📍 ${lugar}
            </div>

            <div class="dato">
                🌎 ${lat}, ${lon}
            </div>

            <div class="dato">
                📈 Magnitud ${mag}
            </div>

            <div class="dato">
                📉 Profundidad ${prof} km
            </div>

            <div class="dato">
                🕒 ${fecha} ${hora}
            </div>
        </div>
        `;
    }

    document.getElementById("contenido").innerHTML =
    html;
}

cargar();

</script>

</body>
</html>
