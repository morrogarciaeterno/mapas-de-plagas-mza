<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitor Satelital</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
padding:0;
height:100%;
}

#map{
width:100%;
height:100vh;
}

.panel{
position:absolute;
top:10px;
left:10px;
z-index:9999;
background:rgba(0,0,0,.85);
padding:10px;
border-radius:10px;
display:flex;
gap:6px;
flex-wrap:wrap;
}

button{
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
color:#fff;
}

.nubes{background:#2563eb;}
.luces{background:#ca8a04;}
.fuego{background:#dc2626;}
.gps{background:#16a34a;}
</style>
</head>

<body>

<div class="panel">
<button id="btnNubes" class="nubes">☁️ Nubes</button>
<button id="btnLuces" class="luces">🌃 Luces</button>
<button id="btnFuego" class="fuego">🔥 Fuego</button>
<button id="btnGPS" class="gps">📍 GPS</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-32.89,-68.84],6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap',
maxZoom:19
}
).addTo(map);

const fecha = new Date(Date.now()-86400000)
.toISOString()
.split('T')[0];

const nubes = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/' +
fecha +
'/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg',
{
opacity:0.6,
maxNativeZoom:9,
maxZoom:19
}
);

const luces = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png',
{
opacity:0.8,
maxNativeZoom:8,
maxZoom:19
}
);

const fuego = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_Thermal_Anomalies_375m_All/default/' +
fecha +
'/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png',
{
opacity:0.9,
maxNativeZoom:9,
maxZoom:19
}
);

document.getElementById("btnNubes").onclick=()=>{
    if(map.hasLayer(nubes)){
        map.removeLayer(nubes);
    }else{
        nubes.addTo(map);
    }
};

document.getElementById("btnLuces").onclick=()=>{
    if(map.hasLayer(luces)){
        map.removeLayer(luces);
    }else{
        luces.addTo(map);
    }
};

document.getElementById("btnFuego").onclick=()=>{
    if(map.hasLayer(fuego)){
        map.removeLayer(fuego);
    }else{
        fuego.addTo(map);
    }
};

let marcador;

function ubicar(){

navigator.geolocation.getCurrentPosition(

(pos)=>{

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

map.setView([lat,lon],8);

if(marcador){
map.removeLayer(marcador);
}

marcador=L.marker([lat,lon])
.addTo(map)
.bindPopup("📍 Tu ubicación")
.openPopup();

},

(err)=>{
console.log(err);
}

);

}

document.getElementById("btnGPS").onclick=ubicar;

window.onload=ubicar;

</script>

</body>
</html>
``
