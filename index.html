<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SNIH Proxy Test</title>
</head>
<body>

<h2>SNIH - Estación</h2>

<input id="id" value="11424">
<button onclick="consultar()">Consultar</button>

<pre id="out"></pre>

<script>

async function consultar(){

    const out =
        document.getElementById("out");

    out.textContent = "Consultando...";

    try{

        const response = await fetch(
            "https://snih-proxy.elexpreso17.workers.dev",
            {
                method: "POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    estacion:
                    document.getElementById("id").value
                })
            }
        );

        const texto = await response.text();

        out.textContent = texto;

    }
    catch(err){

        console.error(err);

        out.textContent =
            "ERROR:\n" + err;

    }

}

</script>

</body>
</html>
