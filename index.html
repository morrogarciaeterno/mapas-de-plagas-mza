<!DOCTYPE html>
<html>
<head>
  <title>Agrotech-Mendoza | Monitoreo de Riesgo y NDVI</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-bar { background: #2c3e50; color: white; padding: 12px; font-size: 0.95rem; text-align: center; font-weight: bold; z-index: 1000; }
    #map { flex-grow: 1; width: 100%; background: #f0f0f0; }
  </style>
</head>
<body>
  <div id="info-bar">📍 Mueve el marcador a cualquier lugar para consultar el clima.</div>
  <div id="map"></div>

  <script>
    var latInicial = -33.65;
    var lonInicial = -69.20;

    var map = L.map('map').setView([latInicial, lonInicial], 11);

    L.tileLayer('https://api.maptiler.com/maps/outdoor-v4/{z}/{x}/{y}.png?key=pA0O2I617xTzrBmgMIUT', {
      maxZoom: 18,
      attribution: '&copy; MapTiler &copy; OpenStreetMap contributors'
    }).addTo(map);

    // Función para crear un ícono con color dinámico
    function crearIconoRiesgo(colorHex) {
      return L.divIcon({
        className: 'custom-pin',
        html: `<div style="background-color: ${colorHex}; width: 26px; height: 26px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 8px rgba(0,0,0,0.6);"></div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
    }

    // Crear marcador arrastrable con color inicial por defecto (gris o verde)
    var marker = L.marker([latInicial, lonInicial], {
      draggable: true,
      icon: crearIconoRiesgo('#2ecc71')
    }).addTo(map);

    marker.bindPopup("Cargando datos...").openPopup();

    function actualizarDatosUbicacion(lat, lon) {
      document.getElementById('info-bar').innerHTML = "⏳ Consultando clima...";

      var urlClimaAPI = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,relative_humidity_2m";

      fetch(urlClimaAPI)
        .then(response => response.json())
        .then(climaData => {
          var tempActual = "22.5";
          var humActual = "45.0";

          if (climaData && climaData.current) {
            tempActual = climaData.current.temperature_2m;
            humActual = climaData.current.relative_humidity_2m;
          }

          var urlNDVI = "https://raw.githubusercontent.com/morrogarciaeterno/mapas-de-plagas-mza/refs/heads/main/NDVI_Mendoza.csv";

          Papa.parse(urlNDVI, {
            download: true,
            header: true,
            complete: function(ndviResults) {
              var ndviRow = ndviResults.data[0] || {};
              var ndviValue = parseFloat(ndviRow.NDVI) || 0.070;

              var riesgo = "Bajo (Saludable)";
              var colorRiesgo = "#2ecc71"; // Verde

              if (ndviValue < 0.4) {
                riesgo = "Alto (Estrés / Suelo)";
                colorRiesgo = "#e74c3c"; // Rojo
              } else if (ndviValue < 0.6) {
                riesgo = "Moderado";
                colorRiesgo = "#f39c12"; // Naranja / Amarillo
              }

              // Actualizar el color visual del marcador en el mapa
              marker.setIcon(crearIconoRiesgo(colorRiesgo));

              var popupContent = 
                "<b>Coordenadas:</b> " + lat.toFixed(3) + ", " + lon.toFixed(3) + "<br>" +
                "<b>Riesgo:</b> " + riesgo +
                "<br><b>NDVI Est.:</b> " + ndviValue.toFixed(3) +
                "<br><b>Temperatura:</b> " + tempActual + " °C" +
                "<br><b>Humedad:</b> " + humActual + " %";

              marker.setPopupContent(popupContent);
              marker.openPopup();
              document.getElementById('info-bar').innerHTML = "✅ Actualizado: " + lat.toFixed(3) + ", " + lon.toFixed(3);
            },
            error: function() {
              var popupContent = 
                "<b>Coordenadas:</b> " + lat.toFixed(3) + ", " + lon.toFixed(3) + "<br>" +
                "<b>Temperatura:</b> " + tempActual + " °C<br>" +
                "<b>Humedad:</b> " + humActual + " %";
              marker.setPopupContent(popupContent);
              marker.openPopup();
            }
          });
        })
        .catch(error => {
          console.error("Error:", error);
          document.getElementById('info-bar').innerHTML = "❌ Error al obtener el clima.";
        });
    }

    // Cargar al iniciar
    actualizarDatosUbicacion(latInicial, lonInicial);

    // Evento al soltar el marcador
    marker.on('dragend', function(event) {
      var posicion = marker.getLatLng();
      actualizarDatosUbicacion(posicion.lat, posicion.lng);
    });
  </script>
</body>
</html>
