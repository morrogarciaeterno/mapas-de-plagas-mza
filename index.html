<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SNIH Test</title>
</head>
<body>

<input id="id" value="11424">
<button onclick="test()">Consultar</button>

<pre id="out"></pre>

<script>

async function test(){

    const out =
        document.getElementById("out");

    try{

        const endpoint =
            "https://snih.hidricosargentina.gob.ar/MuestraDatos.aspx/LeerDatosActuales";

        const res = await fetch(
            "https://cors.eu.org/" + endpoint,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json; charset=utf-8"
                },
                body:JSON.stringify({
                    estacion:
                    document.getElementById("id").value
                })
            }
        );

        const txt = await res.text();

        out.textContent = txt;

    }
    catch(e){

        out.textContent =
            e.toString();

        console.error(e);

    }
}

</script>

</body>
</html>
