<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Territoria - Sistema Oficial</title>
    <!-- Librería Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Librería Leaflet.draw para dibujo de polígonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- Librería PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <!-- Firebase App y Firestore (Compat SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #070a14;
            --card-bg: #0e1526;
            --card-inner: #162035;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg);
            color: var(--text-main);
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-text-size-adjust: 100%;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            padding-top: max(12px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-content {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex-grow: 1;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border-radius: 50%;
            background: #ffffff;
            padding: 2px;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .brand-text-container {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand p {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
            line-height: 1.2;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .date-display {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #fecha {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: capitalize;
            line-height: 1.1;
        }

        .time-temp-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 1px;
        }

        #digitalFallback {
            font-size: 0.7rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            line-height: 1.1;
        }

        #headerTemp {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
        }

        .btn-notif-header {
            background: var(--accent-glow);
            border: 1px solid var(--accent);
            color: var(--accent);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 12px 50px 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .card h3 {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .metric {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 4px;
        }

        .card-temp-main {
            grid-column: span 2;
        }

        @media (min-width: 768px) {
            .card-temp-main {
                grid-column: span 1;
            }
        }

        .card-temp-main .metric {
            font-size: 2.8rem !important;
            font-weight: 900 !important;
            color: #ffffff !important;
            line-height: 0.95;
            margin-top: 4px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .temp-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forecast-cards {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 6px;
        }

        .forecast-card {
            flex: 0 0 72px;
            background: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.05);
        }

        .forecast-card .icon {
            font-size: 1.3rem;
            margin: 4px 0;
        }

        .forecast-card .max {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--accent);
        }

        .forecast-card .min {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .sismos-grid-horizontal {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            padding-bottom: 6px;
        }

        .sismo-mini-card {
            flex: 0 0 140px;
            background: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        .sismo-mini-mag {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 3px 0;
        }

        .sismo-mendoza {
            color: #ef4444 !important;
            font-weight: 900;
        }

        .sismo-normal {
            color: var(--accent);
        }

        .dashboard-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .dashboard-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .solar-container {
            display: flex;
