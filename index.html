
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Territoria Meteo</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:10px;
margin:0;
}

h2{
color:#1565c0;
}

.card{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.10);
}

.valor{
font-size:24px;
font-weight:bold;
}

.verde{color:#2e7d32;}
.amarillo{color:#f9a825;}
.rojo{color:#c62828;}

canvas{
    width:100%;
    max-width:300px;   /* ancho máximo */
    height:120px;      /* alto fijo */
    display:block;
    margin:auto;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
}

</style>
</head>

<body>

<h2>🌎 Territoria Meteo</h2>

<div class="card">
<h3>📍 Ubicación</h3>
<div class="valor" id="ubicacion">
Buscando ubicación...
</div>
</div>

<div class="card">
<h3>🌡️ Temperatura</h3>
<div class="valor" id="temp">--</div>
</div>

<div class="card">
<h3>💧 Humedad</h3>
<div class="valor" id="humedad">--</div>
</div>

<div class="card">
<h3>🌬️ Viento</h3>
<div class="valor" id="viento">--</div>
</div>

<div class="card">
<h3>☁️ Nubosidad</h3>
<div class="valor" id="nubes">--</div>
</div>

<div class="card">
<h3>📊 Presión</h3>
<div class="valor" id="presion">--</div>
</div>

<div class="card">
<h3>❄️ Helada</h3>
<div class="valor" id="helada">--</div>
</div>

<div class="card">
<h3>⛈️ Tormenta</h3>
<div class="valor" id="tormenta">--</div>
</div>

<div class="card">
<h3>🧊 Granizo</h3>
<div class="valor" id="granizo">--</div>
</div>

<div class="card">
<h3>🔥 Incendio</h3>
<div class="valor" id="incendio">--</div>
</div>

<div class="card">
<h3>📈 Histórico de Presión</h3>
<canvas id="grafico" width="450" height="120"></canvas>
</div>

<script>

let historialPresion =
JSON.parse(
localStorage.getItem("historialPresion")
) || [];

function claseColor(valor){

if(valor < 30) return "verde";
if(valor < 70) return "amarillo";
return "rojo";

}

function mostrarRiesgo(id,valor){

document.getElementById(id).innerHTML =
'<span class="' +
claseColor(valor) +
'">' +
valor +
'%</span>';

}

function guardarPresion(valor){

historialPresion.push({
hora:new Date().toLocaleTimeString(),
presion:valor
});

if(historialPresion.length > 50){
historialPresion.shift();
}

localStorage.setItem(
"historialPresion",
JSON.stringify(historialPresion)
);

dibujarGrafico();

}

function dibujarGrafico(){

const canvas =
document.getElementById("grafico");

const ctx =
canvas.getContext("2d");

const w = canvas.width;
const h = canvas.height;

ctx.clearRect(0,0,w,h);

if(historialPresion.length < 2){

ctx.font = "14px Arial";
ctx.fillStyle = "#666";
ctx.fillText(
"Esperando más mediciones...",
20,
40
);

return;

}

const valores =
historialPresion.map(x=>x.presion);

const min =
Math.min(...valores);

const max =
Math.max(...valores);

const rango =
(max-min) || 1;

ctx.beginPath();

historialPresion.forEach((dato,i)=>{

const x =
(i/(historialPresion.length-1))*w;

const y =
h -
(((dato.presion-min)/rango)*(h-40))
-15;

if(i===0)
ctx.moveTo(x,y);
else
ctx.lineTo(x,y);

});

ctx.strokeStyle="#1565c0";
ctx.lineWidth=3;
ctx.stroke();

}

async function iniciar(){

if(!navigator.geolocation){

document.getElementById("ubicacion").innerHTML =
"GPS no soportado";

return;

}

navigator.geolocation.getCurrentPosition(

async function(pos){

const lat = pos.coords.latitude;
const lon = pos.coords.longitude;

try{

const geo = await fetch(
"https://nominatim.openstreetmap.org/reverse?format=json&lat="
+ lat +
"&lon="
+ lon
);

const lugar = await geo.json();

const localidad =
lugar.address.city ||
lugar.address.town ||
lugar.address.village ||
lugar.address.suburb ||
lugar.address.county ||
"Ubicación detectada";

const provincia =
lugar.address.state || "";

document.getElementById("ubicacion").innerHTML =
"📍 " +
localidad +
", " +
provincia;

}catch(e){

document.getElementById("ubicacion").innerHTML =
"📍 Ubicación detectada";

}

const url =
"https://api.open-meteo.com/v1/forecast?latitude="
+ lat +
"&longitude="
+ lon +
"&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m,cloud_cover";

const r = await fetch(url);
const d = await r.json();

const t =
d.current.temperature_2m;

const h =
d.current.relative_humidity_2m;

const p =
d.current.surface_pressure;

const v =
d.current.wind_speed_10m;

const n =
d.current.cloud_cover;

document.getElementById("temp").innerHTML =
t + " °C";

document.getElementById("humedad").innerHTML =
h + " %";

document.getElementById("viento").innerHTML =
v + " km/h";

document.getElementById("presion").innerHTML =
p + " hPa";

document.getElementById("nubes").innerHTML =
n + " %";

/* HELADA */

let helada = 0;

if(t < 8) helada += 40;
if(t < 4) helada += 40;
if(v < 10) helada += 20;

/* TORMENTA */

let tormenta = 0;

if(h > 60) tormenta += 20;
if(h > 80) tormenta += 20;
if(n > 50) tormenta += 20;
if(n > 80) tormenta += 20;
if(v > 20) tormenta += 20;

/* GRANIZO */

let granizo = 0;

if(h > 70) granizo += 20;
if(h > 85) granizo += 20;
if(n > 60) granizo += 20;
if(n > 80) granizo += 20;
if(t > 20) granizo += 20;

/* INCENDIO */

let incendio = 0;

if(h < 40) incendio += 40;
if(h < 25) incendio += 30;
if(v > 20) incendio += 30;

helada = Math.min(100,helada);
tormenta = Math.min(100,tormenta);
granizo = Math.min(100,granizo);
incendio = Math.min(100,incendio);

mostrarRiesgo("helada",helada);
mostrarRiesgo("tormenta",tormenta);
mostrarRiesgo("granizo",granizo);
mostrarRiesgo("incendio",incendio);

guardarPresion(p);

},

function(error){

document.getElementById("ubicacion").innerHTML =
"Error GPS: " + error.code;

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}

window.onload = function(){

iniciar();

setInterval(
iniciar,
300000
);

};

</script>

</body>
</html>
