<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidrometría Mendoza</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family: "Segoe UI", sans-serif;
    background:#eef3f9;
    color:#333;
}
header{
    background:linear-gradient(135deg,#0066cc,#0099ff);
    color:white;
    padding:30px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}
header h1{
    font-size:32px;
}
header p{
    opacity:.9;
    margin-top:8px;
}
.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}
.search-box{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:flex;
    gap:10px;
    margin-bottom:25px;
}
input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}
button{
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#0066cc;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#0051a8;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}
.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
}
.card:hover{
    transform:translateY(-3px);
}
.nombre{
    color:#777;
    font-size:14px;
    margin-bottom:10px;
}
.valor{
    font-size:38px;
    font-weight:700;
    color:#0066cc;
}
.unidad{
    color:#999;
    margin-top:4px;
}
.json-box{
    margin-top:25px;
    background:#111827;
    color:#00ff88;
    border-radius:15px;
    padding:20px;
    overflow:auto;
    max-height:300px;
}
.loading{
    text-align:center;
    font-size:18px;
    padding:30px;
}
</style>
</head>
<body>
<header>
    <h1>🌊 Hidrometría Mendoza</h1>
    <p>Monitoreo en tiempo real desde SNIH</p>
</header>
<div class="container">
    <div class="search-box">
        <input
            id="id"
            value="11453"
            placeholder="ID de estación">
        <button onclick="consultar()">
            Consultar
        </button>
    </div>
    <div id="resultado" class="cards">
    </div>
    <div class="json-box">
        <pre id="json"></pre>
    </div>
</div>
<script>
const WORKER =
"https://snih-proxy.elexpreso17.workers.dev";
const unidades = {
    "Altura":"m",
    "Precipitación":"mm",
    "Precipitación acumulada diaria":"mm",
    "Precipitación acumulada mensual":"mm",
    "Conductividad Eléctrica":"µS/cm",
    "Temperatura Bulbo Seco":"°C",
    "Temperatura":"°C",
    "Humedad":"%",
    "Velocidad del Viento":"km/h",
    "Presión Atmosférica [mBar]":"mBar",
    "Radiacion Solar":"W/m²"
};
async function consultar(){
    const resultado =
        document.getElementById("resultado");
    resultado.innerHTML =
        '<div class="loading">Consultando estación...</div>';
    try{
        const response =
            await fetch(
                WORKER,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        estacion:
                        document.getElementById("id").value
                    })
                }
            );
        const data =
            await response.json();
        document.getElementById("json")
            .textContent =
            JSON.stringify(data,null,2);
        resultado.innerHTML = "";
        const mediciones =
            data.d.Mediciones || [];
        mediciones.forEach(m => {
            let valor = m.Valor;
            if(valor === -999){
                valor = "N/D";
            }
            else{
                valor = Number(valor).toFixed(2);
            }
            const unidad =
                unidades[m.NombreCodigo] || "";
            resultado.innerHTML += `
                <div class="card">
                    <div class="nombre">
                        ${m.NombreCodigo}
                    </div>
                    <div class="valor">
                        ${valor}
                    </div>
                    <div class="unidad">
                        ${unidad}
                    </div>
                </div>
            `;
        });
    }catch(error){
        resultado.innerHTML = `
            <div class="card">
                Error al consultar la estación.
            </div>
        `;
        console.error(error);
    }
}
consultar();
</script>
</body>
</html>
