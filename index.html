<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría de Canales - Mendoza</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        .popup-content { font-family: Arial, sans-serif; font-size: 14px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Inicializar el mapa centrado en la zona de Mendoza
        var map = L.map('map').setView([-32.965, -68.845], 12);

        // Capa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Datos GeoJSON con las estaciones de telemetría
        var geojsonData = {
          "type": "FeatureCollection",
          "features": [
            {
              "type": "Feature",
              "geometry": { "type": "Point", "coordinates": [-68.851, -32.956] },
              "properties": { 
                  "sitecode": 101, 
                  "nombre": "Rama Sobremonte Carrodilla", 
                  "caudal": "256.0 l/s",
                  "altura": "17.28 cm",
                  "fecha": "21/10/2026 07:49 PM"
              }
            },
            {
              "type": "Feature",
              "geometry": { "type": "Point", "coordinates": [-68.835, -32.975] },
              "properties": { 
                  "sitecode": 113, 
                  "nombre": "Canal Lunlunta 2", 
                  "caudal": "0.0 l/s",
                  "altura": "0.0 cm",
                  "fecha": "21/10/2026 07:50 PM"
              }
            }
          ]
        };

        // Agregar las capas GeoJSON al mapa con popups informativos
        L.geoJSON(geojsonData, {
            onEachFeature: function (feature, layer) {
                if (feature.properties) {
                    var props = feature.properties;
                    var popupText = `<div class="popup-content">` +
                                    `<b>Estación:</b> ${props.nombre} (Cód: ${props.sitecode})<br>` +
                                    `<b>Caudal:</b> ${props.caudal}<br>` +
                                    `<b>Altura:</b> ${props.altura}<br>` +
                                    `<b>Actualización:</b> ${props.fecha}` +
                                    `</div>`;
                    layer.bindPopup(popupText);
                }
            }
        }).addTo(map);
    </script>
</body>
</html>
