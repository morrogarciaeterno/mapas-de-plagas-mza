<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNIH Mendoza</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
}

input{
    padding:8px;
    width:120px;
}

button{
    padding:8px 20px;
    cursor:pointer;
}

.valor{
    font-size:32px;
    font-weight:bold;
    color:#0b63ce;
    margin-top:15px;
}

pre{
    background:#111;
    color:#00ff66;
    padding:15px;
    overflow:auto;
}
</style>
</head>
<body>

<div class="card">

<h2>SNIH Mendoza</h2>

<p>ID Estación:</p>

<input id="id" value="11424">

<button onclick="consultar()">
Consultar
</button>

<div id="resultado"></div>

<h3>JSON</h3>

<pre id="json"></pre>

</div>

<script>

const WORKER =
"https://snih-proxy.elexpreso17.workers.dev";

async function consultar(){

    const resultado =
        document.getElementById("resultado");

    const jsonBox =
        document.getElementById("json");

    resultado.innerHTML =
        "Consultando...";

    try{

        const response =
            await fetch(
                WORKER,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        estacion:
                        document.getElementById("id").value
                    })
                }
            );

        const data =
            await response.json();

        jsonBox.textContent =
            JSON.stringify(data,null,2);

        if(
            !data.d ||
            !data.d.Mediciones ||
            !data.d.Mediciones.length
        ){
            resultado.innerHTML =
                "<p>Sin mediciones.</p>";
            return;
        }

        const m =
            data.d.Mediciones[0];

        let valor =
            m.Valor;

        if(valor === -999){
            valor = "Sin dato";
        }

        resultado.innerHTML = `
            <h3>${m.NombreCodigo}</h3>
            <div class="valor">${valor}</div>
        `;

    }
    catch(error){

        resultado.innerHTML =
            "<p>Error al consultar.</p>";

        console.error(error);

    }

}

</script>

</body>
</html>
