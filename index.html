<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SNIH Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:30px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:700px;
}

input{
    padding:8px;
}

button{
    padding:8px 20px;
    cursor:pointer;
}

pre{
    background:#111;
    color:#0f0;
    padding:15px;
    overflow:auto;
}
</style>
</head>
<body>

<div class="card">

    <h2>SNIH Proxy Test</h2>

    <input id="estacion" value="11424">

    <button onclick="consultar()">
        Consultar
    </button>

    <pre id="salida"></pre>

</div>

<script>

async function consultar(){

    const salida =
        document.getElementById("salida");

    salida.textContent = "Consultando...";

    try{

        const endpoint =
            "https://snih.hidricosargentina.gob.ar/MuestraDatos.aspx/LeerDatosActuales";

        const response = await fetch(

            "https://corsproxy.io/?"
            + encodeURIComponent(endpoint),

            {
                method: "POST",
                headers:{
                    "Content-Type":
                    "application/json; charset=utf-8"
                },
                body: JSON.stringify({
                    estacion:
                    document.getElementById("estacion").value
                })
            }
        );

        const texto =
            await response.text();

        salida.textContent = texto;

        console.log(texto);

    }
    catch(err){

        console.error(err);

        salida.textContent =
            "ERROR:\n\n" + err;
    }
}

</script>

</body>
</html>
