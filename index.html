
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitor Satelital</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
}

#map{
    width:100%;
    height:100vh;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    background:rgba(0,0,0,.85);
    padding:10px;
    border-radius:12px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    max-width:95%;
}

button{
    border:none;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}

input{
    padding:8px;
    border-radius:6px;
    border:none;
    width:220px;
}

.nubes{background:#2563eb;}
.luces{background:#ca8a04;}
.fuego{background:#dc2626;}
.gps{background:#16a34a;}
.buscar{background:#7c3aed;}
</style>
</head>
<body>

<div class="panel">
    <button id="btnNubes" class="nubes">☁️ Nubes</button>
    <button id="btnLuces" class="luces">🌃 Luces</button>
    <button id="btnFuego" class="fuego">🔥 Fuego</button>
    <button id="btnGPS" class="gps">📍 GPS</button>
    <input id="direccion" type="text" placeholder="Dirección o localidad">
    <button id="btnBuscar" class="buscar">🔍 Buscar</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([-32.89,-68.84],6);

// Definimos los mapas base para Día y Noche
const mapBaseDia = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'© OpenStreetMap' }
);

const mapBaseNoche = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { attribution:'© OpenStreetMap & CartoDB' }
);

// Función para evaluar si es de día (de 6:00 AM a 7:00 PM) o de noche
function esDeDia() {
    const hora = new Date().getHours();
    return hora >= 6 && hora < 19;
}

// Aplicar el mapa base correspondiente según la hora actual
if (esDeDia()) {
    mapBaseDia.addTo(map);
} else {
    mapBaseNoche.addTo(map);
}

// Fechas para capas de la NASA
const fechaNubes = new Date(
    Date.now() - (3 * 24 * 60 * 60 * 1000)
).toISOString().split('T')[0];

const fechaFuego = new Date(
    Date.now() - 86400000
).toISOString().split('T')[0];

/* NUBES */
const nubes = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/' +
fechaNubes +
'/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg',
{
    opacity:0.65,
    maxNativeZoom:9,
    maxZoom:18,
    bounds: [[-90, -180], [90, 180]]
}
);

/* LUCES */
const luces = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png',
{
    opacity:0.75,
    maxNativeZoom:8,
    maxZoom:18
}
);

/* FUEGO */
const fuego = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_Thermal_Anomalies_375m_All/default/' +
fechaFuego +
'/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png',
{
    opacity:0.90,
    maxNativeZoom:9,
    maxZoom:18
}
);

document.getElementById("btnNubes").onclick = ()=>{
    if(map.hasLayer(nubes)){
        map.removeLayer(nubes);
    }else{
        nubes.addTo(map);
    }
};

document.getElementById("btnLuces").onclick = ()=>{
    if(map.hasLayer(luces)){
        map.removeLayer(luces);
    }else{
        luces.addTo(map);
    }
};

document.getElementById("btnFuego").onclick = ()=>{
    if(map.hasLayer(fuego)){
        map.removeLayer(fuego);
    }else{
        fuego.addTo(map);
    }
};

/* GPS */
let marcadorGPS;

function ubicarUsuario(){
    navigator.geolocation.getCurrentPosition(
        (pos)=>{
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            map.flyTo([lat,lon],10,{
                duration:2
            });

            if(marcadorGPS){
                map.removeLayer(marcadorGPS);
            }

            marcadorGPS = L.marker([lat,lon])
            .addTo(map)
            .bindPopup("📍 Tu ubicación")
            .openPopup();
        },
        (err)=>{
            console.log(err);
        }
    );
}

document.getElementById("btnGPS").onclick = ubicarUsuario;

/* BUSCADOR */
let marcadorBusqueda = null;

document.getElementById("btnBuscar").onclick = async ()=>{
    const texto = document.getElementById("direccion").value.trim();

    if(!texto){
        alert("Ingrese una dirección");
        return;
    }

    try{
        const respuesta = await fetch(
            'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
            encodeURIComponent(texto)
        );

        const datos = await respuesta.json();

        if(datos.length===0){
            alert("No encontrada");
            return;
        }

        const lat = parseFloat(datos[0].lat);
        const lon = parseFloat(datos[0].lon);

        map.flyTo(
            [lat,lon],
            13,
            {
                duration:2
            }
        );

        if(marcadorBusqueda){
            map.removeLayer(marcadorBusqueda);
        }

        marcadorBusqueda = L.marker([lat,lon])
        .addTo(map)
        .bindPopup(datos[0].display_name)
        .openPopup();

    }catch(error){
        console.error(error);
        alert("Error al buscar dirección");
    }
};

window.onload = ()=>{
    ubicarUsuario();
    // Ya no se cargan las nubes automáticamente al iniciar para que mande el mapa base diurno/nocturno
};
</script>

</body>
</html>
