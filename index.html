<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor Geográfico OGC - Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        /* Asegurar que el mapa ocupe toda la pantalla correctamente en móviles */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col h-full">

    <!-- Header / Panel Superior Compacto para Celular -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 flex flex-col gap-2 z-20 shadow-md">
        <div class="flex justify-between items-center">
            <h1 class="text-sm font-bold tracking-wide text-emerald-400">Visor Geográfico (OGC/WMS)</h1>
            <span id="status" class="text-[10px] bg-emerald-950/80 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800/50 font-semibold">Listo</span>
        </div>

        <!-- Selector de Capas en Mini-Pills para táctil -->
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
            <label class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-slate-700/80 border border-slate-600 cursor-pointer whitespace-nowrap">
                <input type="radio" name="layer" value="none" checked class="text-emerald-500">
                <span>Mapa Base</span>
            </label>
            <label class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-slate-700/80 border border-slate-600 cursor-pointer whitespace-nowrap">
                <input type="radio" name="layer" value="idera" class="text-emerald-500">
                <span>IDERA / IGN WMS</span>
            </label>
        </div>
    </header>

    <!-- Mapa Principal ocupando todo el espacio restante -->
    <main class="flex-1 relative w-full h-full">
        <div id="map" class="w-full h-full absolute inset-0"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Inicializar el mapa centrado en Argentina adaptado a móvil
        const map = L.map('map', { zoomControl: false }).setView([-38.4161, -63.6167], 4);

        // Mover los controles de zoom a la esquina inferior derecha para no estorbar con el header
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Mapa base libre de restricciones y sin API Keys
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        let wmsLayer = null;
        const statusEl = document.getElementById('status');

        // Control de selección de capas WMS
        const radios = document.querySelectorAll('input[type=radio][name="layer"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (wmsLayer) {
                    map.removeLayer(wmsLayer);
                    wmsLayer = null;
                }

                if (e.target.value === 'idera') {
                    statusEl.innerText = 'Cargando...';
                    
                    wmsLayer = L.tileLayer.wms('https://wms.ign.gob.ar/geoserver/wms?', {
                        layers: 'ign:ign_base_gde',
                        format: 'image/png',
                        transparent: true,
                        version: '1.1.0',
                        attribution: 'IDERA / IGN'
                    }).addTo(map);

                    wmsLayer.on('load', () => {
                        statusEl.innerText = 'Activo';
                    });
                    statusEl.innerText = 'Activo';
                } else {
                    statusEl.innerText = 'Listo';
                }
            });
        });
    </script>
</body>
</html>
