[!DOCTYPE html]
[html lang="es"]
[head]
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nubes VIIRS NASA</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
padding:0;
height:100%;
}

#map{
height:100vh;
width:100%;
}

.panel{
position:absolute;
top:10px;
left:10px;
z-index:9999;
background:rgba(0,0,0,.8);
padding:8px;
border-radius:8px;
}

button{
background:#0d6efd;
color:#fff;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}
</style>

[/head]

[body]

<div class="panel">
<button id="btnVIIRS">🛰️ VIIRS</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-32.89,-68.84],6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

let viirs = null;

document.getElementById('btnVIIRS').onclick = () => {

if(viirs){
map.removeLayer(viirs);
viirs = null;
return;
}

const fecha = new Date(
Date.now() - (2 * 24 * 60 * 60 * 1000)
).toISOString().split('T')[0];

viirs = L.tileLayer(
`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${fecha}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
{
opacity:0.75,
maxZoom:9
}
);

viirs.addTo(map);

};

navigator.geolocation.getCurrentPosition(
(pos)=>{
map.setView(
[pos.coords.latitude,pos.coords.longitude],
8
);

L.marker([
pos.coords.latitude,
pos.coords.longitude
]).addTo(map);
}
);

</script>

[/body]
[/html]
