<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIIRS NASA + Geolocalización GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html, body { margin: 0; padding: 0; height: 100%; }
#map { width: 100%; height: 100vh; }
.panel { position: absolute; top: 10px; left: 10px; z-index: 1000; display: flex; gap: 8px; }
button { padding: 10px 15px; background: #0d6efd; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
button.active { background: #198754; }
button.gps { background: #38bdf8; color: #000; }
</style>
</head>
<body>

<div class="panel">
    <button id="btn">🛰️ Satélite VIIRS</button>
    <button id="btnGps" class="gps" onclick="centrarUbicacion()">📍 GPS</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Crear mapa
const map = L.map('map', {
    maxBounds: [[-90, -180], [90, 180]],
    maxBoundsViscosity: 1.0
}).setView([-32.89, -68.84], 12);

// Base OSM
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    noWrap: true
}).addTo(map);

let capaVIIRS = null;
let marcadorGps = null;
let circuloGps = null;
const btn = document.getElementById('btn');

// Botón VIIRS
btn.onclick = () => {
    if (capaVIIRS) {
        map.removeLayer(capaVIIRS);
        capaVIIRS = null;
        btn.classList.remove('active');
        btn.innerText = '🛰️ Satélite VIIRS';
        return;
    }

    const fechaAyer = new Date(Date.now() - 86400000).toISOString().split('T')[0];

    capaVIIRS = L.tileLayer(
        `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${fechaAyer}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
        {
            maxZoom: 18,
            maxNativeZoom: 9,
            opacity: 0.9,
            noWrap: true,
            bounds: [[-90, -180], [90, 180]]
        }
    );

    capaVIIRS.addTo(map);
    btn.classList.add('active');
    btn.innerText = '🛰️ Ocultar VIIRS';
};

// Función de Geolocalización con punto azul
function centrarUbicacion() {
    if (!navigator.geolocation) {
        alert("La geolocalización no está soportada en tu navegador.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // Eliminar marcadores anteriores de GPS si existen
            if (marcadorGps) map.removeLayer(marcadorGps);
            if (circuloGps) map.removeLayer(circuloGps);

            // Icono personalizado de punto azul con brillo
            const iconoAzul = L.divIcon({
                className: '',
                html: '<div style="background-color: #38bdf8; width: 20px; height: 20px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 0 15px rgba(56, 189, 248, 0.9);"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            // Círculo de precisión
            circuloGps = L.circle([lat, lon], {
                radius: accuracy / 2,
                color: '#38bdf8',
                fillColor: '#38bdf8',
                fillOpacity: 0.2,
                weight: 1
            }).addTo(map);

            // Marcador de posición actual
            marcadorGps = L.marker([lat, lon], { icon: iconoAzul })
                .addTo(map)
                .bindPopup("<b>Estás aquí</b><br>Precisión: " + Math.round(accuracy) + " metros")
                .openPopup();

            // Centrar mapa en la ubicación del usuario
            map.setView([lat, lon], 15);
        },
        (error) => {
            alert("No se pudo obtener tu ubicación. Asegúrate de dar permisos de GPS.");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

// Ejecutar GPS automáticamente al cargar la página
window.onload = () => {
    centrarUbicacion();
};
</script>

</body>
</html>
