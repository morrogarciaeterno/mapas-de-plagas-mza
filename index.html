<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIIRS NASA - Funcional</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html, body { margin: 0; padding: 0; height: 100%; }
#map { width: 100%; height: 100vh; }
.panel { position: absolute; top: 10px; left: 10px; z-index: 1000; }
button { padding: 10px 15px; background: #0d6efd; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
button.active { background: #198754; }
</style>
</head>
<body>

<div class="panel">
    <button id="btn">🛰️ Satélite VIIRS</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([-32.89, -68.84], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
}).addTo(map);

let capaVIIRS = null;
const btn = document.getElementById('btn');

btn.onclick = () => {
    if (capaVIIRS) {
        map.removeLayer(capaVIIRS);
        capaVIIRS = null;
        btn.classList.remove('active');
        btn.innerText = '🛰️ Satélite VIIRS';
        return;
    }

    const fechaAyer = new Date(Date.now() - 86400000).toISOString().split('T')[0];

    capaVIIRS = L.tileLayer(
        `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${fechaAyer}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
        {
            maxZoom: 18,
            maxNativeZoom: 9,
            opacity: 0.95
        }
    );

    capaVIIRS.addTo(map);
    btn.classList.add('active');
    btn.innerText = '🛰️ Ocultar VIIRS';
};
</script>

</body>
</html>
