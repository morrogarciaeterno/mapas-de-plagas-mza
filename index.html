<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor Geográfico Pro - Campo & Clima</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col h-full">

    <!-- Header / Panel Superior Compacto -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 flex flex-col gap-2 z-20 shadow-md">
        <div class="flex justify-between items-center">
            <h1 class="text-sm font-bold tracking-wide text-emerald-400">Visor Geográfico Pro</h1>
            <div class="flex gap-2 items-center">
                <button id="btn-gps" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1 rounded shadow font-medium transition active:scale-95">📍 GPS</button>
                <span id="status" class="text-[10px] bg-emerald-950/80 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800/50 font-semibold">Listo</span>
            </div>
        </div>

        <!-- Selector de Capas -->
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
            <label class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-slate-700/80 border border-slate-600 cursor-pointer whitespace-nowrap">
                <input type="radio" name="layer" value="none" checked class="text-emerald-500">
                <span>OSM Base</span>
            </label>
            <label class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-slate-700/80 border border-slate-600 cursor-pointer whitespace-nowrap">
                <input type="radio" name="layer" value="ign_base" class="text-emerald-500">
                <span>IGN Base GDE</span>
            </label>
            <label class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-slate-700/80 border border-slate-600 cursor-pointer whitespace-nowrap">
                <input type="radio" name="layer" value="radar" class="text-emerald-500">
                <span>🌧️ Lluvia / Radar</span>
            </label>
        </div>
    </header>

    <!-- Mapa Principal -->
    <main class="flex-1 relative w-full h-full">
        <div id="map" class="w-full h-full absolute inset-0"></div>
        
        <!-- Cuadro Flotante de Coordenadas -->
        <div id="coord-box" class="absolute bottom-3 left-3 bg-slate-900/90 border border-slate-700 text-slate-300 text-[11px] px-3 py-1.5 rounded-lg backdrop-blur z-10 shadow-lg pointer-events-none">
            Tocá el mapa para obtener coordenadas
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        const map = L.map('map', { zoomControl: false }).setView([-32.8908, -68.8272], 7);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Mapa base estándar
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let wmsLayer = null;
        let radarLayer = null;
        let userMarker = null;
        let userAccuracyCircle = null;
        let clickMarker = null;
        const statusEl = document.getElementById('status');
        const coordBox = document.getElementById('coord-box');

        // Control de selección de capas
        document.querySelectorAll('input[type=radio][name="layer"]').forEach(radio => {
            radio.addEventListener('change', async (e) => {
                // Limpiar capas previas
                if (wmsLayer) { map.removeLayer(wmsLayer); wmsLayer = null; }
                if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }

                if (e.target.value === 'ign_base') {
                    statusEl.innerText = 'Cargando...';
                    wmsLayer = L.tileLayer.wms('https://wms.ign.gob.ar/geoserver/wms?', {
                        layers: 'ign:ign_base_gde',
                        format: 'image/png',
                        transparent: true,
                        version: '1.1.0'
                    }).addTo(map);
                    statusEl.innerText = 'Activo';
                } else if (e.target.value === 'radar') {
                    statusEl.innerText = 'Buscando Radar...';
                    try {
                        // Petición a la API de RainViewer para obtener los hosts y caminos reales del radar
                        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                        const data = await response.json();
                        
                        if (data && data.radar && data.radar.past && data.radar.past.length > 0) {
                            const host = data.host; // Host devuelto por la API (ej: https://tilecache.rainviewer.com)
                            const latestFrame = data.radar.past[data.radar.past.length - 1]; // Último registro de radar pasado
                            const path = latestFrame.path; // Ruta dinámica oficial (ej: /v2/radar/171...)
                            
                            // Construcción correcta de la URL de teselas con host y path oficiales
                            // Formato: {host}{path}/512/{z}/{x}/{y}/2/1_1.png (color 2: Universal Blue, opciones: suavizado 1, sin nieve 0)
                            const radarUrl = `${host}${path}/512/{z}/{x}/{y}/2/1_1.png`;

                            radarLayer = L.tileLayer(radarUrl, {
                                opacity: 0.7,
                                attribution: 'RainViewer API',
                                tileSize: 512,
                                zoomOffset: -1
                            }).addTo(map);
                            
                            statusEl.innerText = 'Lluvia Activa';
                        } else {
                            statusEl.innerText = 'Sin Datos';
                        }
                    } catch (err) {
                        statusEl.innerText = 'Error Radar';
                        console.error("Error al cargar radar:", err);
                    }
                } else {
                    statusEl.innerText = 'Listo';
                }
            });
        });

        // Geolocalización GPS
        document.getElementById('btn-gps').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('El navegador no soporta geolocalización.');
                return;
            }
            statusEl.innerText = 'GPS...';
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                map.setView([lat, lng], 14);

                if (userMarker) map.removeLayer(userMarker);
                if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`Estás aquí<br>Precisión: ~${Math.round(accuracy)}m`).openPopup();
                userAccuracyCircle = L.circle([lat, lng], { radius: accuracy, color: '#10b981', fillOpacity: 0.15 }).addTo(map);
                statusEl.innerText = 'Ubicado';
            }, error => {
                alert('No se pudo obtener la posición GPS.');
                statusEl.innerText = 'Error GPS';
            }, { enableHighAccuracy: true });
        });

        // Inspector de Coordenadas
        map.on('click', (e) => {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            coordBox.innerHTML = `Lat: ${lat} | Lon: ${lng}`;

            if (clickMarker) map.removeLayer(clickMarker);
            clickMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map)
                .bindPopup(`<b>Punto Seleccionado:</b><br>Lat: ${lat}<br>Lon: ${lng}`).openPopup();
        });
    </script>
</body>
</html>
