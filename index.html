<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIH Mendoza</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:700px;
    margin:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#004fa3;
}

.item{
    margin-top:15px;
    padding:10px;
    border-bottom:1px solid #ddd;
}

.valor{
    font-size:24px;
    font-weight:bold;
    color:#0066cc;
}
</style>
</head>
<body>

<div class="card">

    <h1>SNIH - Datos actuales</h1>

    <p>ID Estación:</p>
    <input id="estacion" value="11424">

    <button onclick="leerDatos()">
        Consultar
    </button>

    <div id="resultado"></div>

</div>

<script>

async function leerDatos() {

    const estacion =
        document.getElementById("estacion").value;

    const resultado =
        document.getElementById("resultado");

    resultado.innerHTML = "Consultando...";

    try {

        const response = await fetch(
            "https://snih.hidricosargentina.gob.ar/MuestraDatos.aspx/LeerDatosActuales",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json; charset=utf-8"
                },
                body: JSON.stringify({
                    estacion: estacion
                })
            }
        );

        const data = await response.json();

        console.log(data);

        if (!data.d || !data.d.Mediciones) {
            resultado.innerHTML = "Sin datos";
            return;
        }

        let html = "";

        data.d.Mediciones.forEach(m => {

            html += `
            <div class="item">
                <div>${m.NombreCodigo}</div>
                <div class="valor">${m.Valor}</div>
            </div>
            `;
        });

        resultado.innerHTML = html;

    }
    catch(error) {

        console.error(error);

        resultado.innerHTML =
            "Error al consultar la estación";
    }
}

</script>

</body>
</html>
