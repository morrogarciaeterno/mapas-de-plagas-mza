<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidrometría Mendoza</title>

<style>
:root{
    --azul:#0b63ce;
    --fondo:#eef4fa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--fondo);
}

header{
    background:linear-gradient(135deg,#0b63ce,#2d9cff);
    color:white;
    text-align:center;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.search{
    background:white;
    padding:20px;
    border-radius:15px;
    display:flex;
    gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
    flex:1;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    border:none;
    background:var(--azul);
    color:white;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.info{
    background:white;
    margin:20px 0;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    border-top:4px solid var(--azul);
}

.nombre{
    font-size:14px;
    color:#666;
}

.valor{
    font-size:38px;
    font-weight:bold;
    color:var(--azul);
    margin:10px 0;
}

.unidad{
    color:#888;
}

#jsonContainer{
    display:none;
    margin-top:20px;
}

pre{
    background:#111827;
    color:#00ff9d;
    padding:20px;
    border-radius:10px;
    overflow:auto;
}
</style>
</head>

<body>

<header>
    <h1>🌊 Hidrometría Mendoza</h1>
    <p>Datos en tiempo real SNIH</p>
</header>

<div class="container">

    <div class="search">

        <input
            id="id"
            value="11453"
            placeholder="ID estación">

        <button onclick="consultar()">
            Consultar
        </button>

    </div>

    <div id="info"></div>

    <div id="resultado" class="cards"></div>

    <div style="margin-top:20px;">
        <button onclick="toggleJson()">
            Ver / Ocultar JSON
        </button>
    </div>

    <div id="jsonContainer">
        <pre id="json"></pre>
    </div>

</div>

<script>

const WORKER =
"https://snih-proxy.elexpreso17.workers.dev";

function toggleJson(){

    const contenedor =
        document.getElementById("jsonContainer");

    contenedor.style.display =
        contenedor.style.display === "block"
        ? "none"
        : "block";
}

function fechaDotNet(fecha){

    const timestamp =
        parseInt(
            fecha
                .replace("/Date(","")
                .replace(")/","")
        );

    return new Date(timestamp)
        .toLocaleString("es-AR");
}

function obtenerUnidad(nombre){

    if(nombre.includes("Altura")) return "m";
    if(nombre.includes("Temperatura")) return "°C";
    if(nombre.includes("Precipitación")) return "mm";
    if(nombre.includes("Humedad")) return "%";
    if(nombre.includes("Velocidad")) return "km/h";
    if(nombre.includes("Presión")) return "mBar";
    if(nombre.includes("Conductividad")) return "µS/cm";
    if(nombre.includes("Radiacion")) return "W/m²";

    return "";
}

async function consultar(){

    const resultado =
        document.getElementById("resultado");

    resultado.innerHTML =
        "<h3>Cargando...</h3>";

    try{

        const response =
            await fetch(
                WORKER,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        estacion:
                        document.getElementById("id").value
                    })
                }
            );

        const data =
            await response.json();

        document.getElementById("json")
            .textContent =
            JSON.stringify(data,null,2);

        const mediciones =
            data.d.Mediciones || [];

        resultado.innerHTML = "";

        if(!mediciones.length){

            resultado.innerHTML =
                "<div class='card'>Sin datos</div>";

            return;
        }

        document.getElementById("info")
            .innerHTML =
            `
            <div class="info">
                <h2>Estación ${document.getElementById("id").value}</h2>
                <p>
                    Actualizado:
                    ${fechaDotNet(mediciones[0].FechaHora)}
                </p>
            </div>
            `;

        mediciones.forEach(item=>{

            let valor =
                Number(item.Valor);

            if(valor === -999){
                valor = "N/D";
            }else{
                valor = valor.toFixed(2);
            }

            resultado.innerHTML += `
                <div class="card">

                    <div class="nombre">
                        ${item.NombreCodigo}
                    </div>

                    <div class="valor">
                        ${valor}
                    </div>

                    <div class="unidad">
                        ${obtenerUnidad(item.NombreCodigo)}
                    </div>

                </div>
            `;

        });

    }catch(error){

        resultado.innerHTML =
            "<div class='card'>Error al consultar</div>";

        console.error(error);
    }
}

consultar();

</script>

</body>
</html>
