<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidrometría Mendoza</title>

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fb;
}

header{
    background:#0077b6;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
    margin:0;
    color:#444;
}

.caudal{
    font-size:2rem;
    color:#0077b6;
    margin:10px 0;
}

.tendencia{
    font-weight:bold;
}

.subiendo{
    color:green;
}

.bajando{
    color:red;
}

.chart-container{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
</style>
</head>
<body>

<header>
    <h1>🌊 Hidrometría Mendoza</h1>
    <p>Monitoreo de caudales de los principales ríos</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Río Mendoza</h3>
            <div class="caudal">52.4 m³/s</div>
            <div class="tendencia subiendo">⬆ Subiendo</div>
        </div>

        <div class="card">
            <h3>Río Tunuyán</h3>
            <div class="caudal">45.8 m³/s</div>
            <div class="tendencia subiendo">⬆ Subiendo</div>
        </div>

        <div class="card">
            <h3>Río Diamante</h3>
            <div class="caudal">33.1 m³/s</div>
            <div class="tendencia bajando">⬇ Bajando</div>
        </div>

        <div class="card">
            <h3>Río Atuel</h3>
            <div class="caudal">41.6 m³/s</div>
            <div class="tendencia subiendo">⬆ Subiendo</div>
        </div>

    </div>

    <div class="chart-container">
        <h2>Caudales Comparativos</h2>
        <canvas id="grafico"></canvas>
    </div>

</div>

<script>

const datos = {
    labels: [
        'Río Mendoza',
        'Río Tunuyán',
        'Río Diamante',
        'Río Atuel'
    ],
    datasets: [{
        label: 'Caudal (m³/s)',
        data: [52.4,45.8,33.1,41.6],
        backgroundColor: [
            '#0077b6',
            '#00b4d8',
            '#48cae4',
            '#90e0ef'
        ]
    }]
};

new Chart(
    document.getElementById('grafico'),
    {
        type:'bar',
        data:datos,
        options:{
            responsive:true,
            plugins:{
                legend:{
                    display:false
                }
            }
        }
    }
);

</script>

</body>
</html>
