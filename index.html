<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing Predicción Meteorológica</title>

<style>
body{
    background:#071220;
    color:white;
    font-family:Arial, sans-serif;
    padding:20px;
}

.card{
    max-width:800px;
    margin:auto;
    background:#0f1c34;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.box{
    background:#172846;
    padding:15px;
    border-radius:12px;
}

.valor{
    font-size:28px;
    font-weight:bold;
    color:#59c7ff;
}

.alerta{
    margin:20px 0;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.verde{background:#0d5e3f;}
.amarillo{background:#8b6b00;}
.naranja{background:#c76a00;}
.rojo{background:#b00020;}

.barra{
    width:100%;
    height:20px;
    background:#24354f;
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
}

.progreso{
    height:100%;
    transition:1s;
}

.lluvia{
    background:#19a7ff;
}

.tormenta{
    background:#ff9800;
}
</style>
</head>
<body>

<div class="card">

<h1>🌦 Predictor Experimental</h1>

<div class="grid">
    <div class="box">
        <div>Temperatura</div>
        <div class="valor">14°C</div>
    </div>

    <div class="box">
        <div>Humedad</div>
        <div class="valor">66%</div>
    </div>

    <div class="box">
        <div>Punto Rocío</div>
        <div class="valor">7.2°C</div>
    </div>

    <div class="box">
        <div>Nubosidad</div>
        <div class="valor">86%</div>
    </div>

    <div class="box">
        <div>Presión</div>
        <div class="valor">930 hPa</div>
    </div>

    <div class="box">
        <div>Viento</div>
        <div class="valor">6 km/h</div>
    </div>
</div>

<div id="alerta" class="alerta">
Calculando...
</div>

<h3>🌧 Probabilidad de Lluvia</h3>

<div>
    <span id="lluviaValor">0%</span>
    <div class="barra">
        <div class="progreso lluvia" id="barraLluvia"></div>
    </div>
</div>

<h3>⛈ Riesgo de Tormenta</h3>

<div>
    <span id="tormentaValor">0%</span>
    <div class="barra">
        <div class="progreso tormenta" id="barraTormenta"></div>
    </div>
</div>

</div>

<script>

// Datos simulados

const meteo = {
    temperature: 14,
    humidity: 66,
    dewPoint: 7.2,
    cloudCover: 86,
    pressure: 930,
    pressureTrend: "falling",
    wind: 6,
    rainProbability: 37,
    cape: 1200,
    liftedIndex: -3
};

// SCORE LLUVIA

function calcularLluvia(d){

    let score = 0;

    score += d.humidity * 0.25;
    score += d.cloudCover * 0.20;
    score += d.rainProbability * 0.25;

    if(d.pressureTrend === "falling")
        score += 15;

    const spread = d.temperature - d.dewPoint;

    if(spread < 2)
        score += 20;
    else if(spread < 5)
        score += 10;

    return Math.min(100, Math.round(score));
}

// SCORE TORMENTA

function calcularTormenta(d){

    let score = 0;

    if(d.cape > 500) score += 20;
    if(d.cape > 1000) score += 20;
    if(d.cape > 2000) score += 20;

    if(d.liftedIndex < -2) score += 20;
    if(d.liftedIndex < -4) score += 10;

    if(d.humidity > 60) score += 10;

    if(d.pressureTrend === "falling")
        score += 20;

    return Math.min(score,100);
}

const lluvia = calcularLluvia(meteo);
const tormenta = calcularTormenta(meteo);

document.getElementById("lluviaValor").innerHTML = lluvia + "%";
document.getElementById("barraLluvia").style.width = lluvia + "%";

document.getElementById("tormentaValor").innerHTML = tormenta + "%";
document.getElementById("barraTormenta").style.width = tormenta + "%";

const alerta = document.getElementById("alerta");

if(tormenta > 75){
    alerta.className = "alerta rojo";
    alerta.innerHTML = "⛈ Alta probabilidad de tormenta";
}
else if(lluvia > 60){
    alerta.className = "alerta naranja";
    alerta.innerHTML = "🌧 Lluvia probable en las próximas horas";
}
else if(lluvia > 40){
    alerta.className = "alerta amarillo";
    alerta.innerHTML = "⚠️ Inestabilidad moderada";
}
else{
    alerta.className = "alerta verde";
    alerta.innerHTML = "✅ Condiciones estables";
}

</script>

</body>
</html>
