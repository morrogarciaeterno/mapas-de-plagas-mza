<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidrometría Mendoza</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", sans-serif;
    background:#eef3f9;
    color:#333;
}

header{
    background:linear-gradient(135deg,#0066cc,#0099ff);
    color:white;
    padding:30px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

header h1{
    font-size:32px;
}

header p{
    opacity:.9;
    margin-top:8px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.search-box{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#0066cc;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0051a8;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.nombre{
    color:#777;
    font-size:14px;
    margin-bottom:10px;
}

.valor{
    font-size:38px;
    font-weight:700;
    color:#0066cc;
}

.unidad{
    color:#999;
    margin-top:4px;
}
