<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Territoria - Alertas SMN (Cloudflare Worker)</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .smn-card {
            background-color: #1e293b;
            border-left: 5px solid #3b82f6;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .smn-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .smn-title {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .smn-badge {
            background-color: #334155;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .smn-alerta-item {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
        }

        .alerta-verde { border-left: 4px solid #22c55e; }
        .alerta-amarilla { border-left: 4px solid #eab308; }
        .alerta-naranja { border-left: 4px solid #f97316; }
        .alerta-roja { border-left: 4px solid #ef4444; }
        .alerta-contingencia { border-left: 4px solid #38bdf8; }

        .alerta-titulo {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .alerta-desc {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .alerta-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px dashed #1e293b;
        }

        .btn-test {
            margin-top: 16px;
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-test:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="smn-card">
        <div class="smn-header">
            <div class="smn-title">
                <span>🇦🇷</span> Avisos SMN (Worker)
            </div>
            <span class="smn-badge" id="smn-status">CONECTANDO...</span>
        </div>

        <div id="smn-contenedor-alertas">
            <div class="smn-alerta-item alerta-contingencia">
                <div class="alerta-desc">Conectando con el servicio de alertas en Cloudflare...</div>
            </div>
        </div>

        <button class="btn-test" onclick="cargarAlertasSMNWorker()">🔄 Actualizar datos</button>
    </div>

    <script>
        // ⚠️ PEGA AQUÍ LA URL COMPLETA DE TU WORKER DESPLEGADO (ej: https://territoria-smn-alertas.tu-subdominio.workers.dev)
        const WORKER_URL = 'https://TU-WORKER.subdominio.workers.dev'; 

        async function cargarAlertasSMNWorker() {
            const contenedor = document.getElementById('smn-contenedor-alertas');
            const statusBadge = document.getElementById('smn-status');

            statusBadge.innerText = 'CONSULTANDO...';
            statusBadge.style.color = '#94a3b8';

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                // Caso 1: El Worker responde en modo contingencia (limited: true)
                if (data.limited) {
                    statusBadge.innerText = 'CONTINGENCIA';
                    statusBadge.style.color = '#38bdf8';

                    const item = (data.items && data.items[0]) || {};
                    contenedor.innerHTML = `
                        <div class="smn-alerta-item alerta-contingencia">
                            <div class="alerta-titulo" style="color: #38bdf8;">🌐 ${item.title || 'Modo Respaldo'}</div>
                            <div class="alerta-desc">${item.description || 'Sistema operando en contingencia.'}</div>
                            <div class="alerta-meta">
                                <span>Fuente: ${item.source || 'Territoria Guard'}</span>
                                <span>Caché: 5 min</span>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Caso 2: Filtrado por la provincia de Mendoza
                const avisosMendoza = (data.items || []).filter(item => {
                    const texto = (item.title + ' ' + item.description).toLowerCase();
                    return texto.includes('mendoza');
                });

                contenedor.innerHTML = '';

                // Sin alertas en Mendoza
                if (avisosMendoza.length === 0) {
                    statusBadge.innerText = 'NORMAL';
                    statusBadge.style.color = '#22c55e';
                    contenedor.innerHTML = `
                        <div class="smn-alerta-item alerta-verde">
                            <div class="alerta-titulo" style="color: #22c55e;">✅ Sin Avisos Activos en Mendoza</div>
                            <div class="alerta-desc">El SMN no registra Avisos a Corto Plazo (ACP) activos para la provincia de Mendoza. (${data.total || 0} aviso/s general/es en el feed).</div>
                            <div class="alerta-meta">
                                <span>Fuente: ${data.source || 'SMN ACP RSS'}</span>
                                <span>Caché Worker: 1h</span>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Alertas detectadas en Mendoza
                statusBadge.innerText = `${avisosMendoza.length} ACP MENDOZA`;
                statusBadge.style.color = '#ef4444';

                avisosMendoza.forEach(aviso => {
                    let claseColor = 'alerta-amarilla';
                    let icono = '⚠️';

                    const textoLower = (aviso.title + ' ' + aviso.description).toLowerCase();
                    if (textoLower.includes('naranja') || textoLower.includes('severa')) {
                        claseColor = 'alerta-naranja';
                        icono = '🟠';
                    } else if (textoLower.includes('rojo') || textoLower.includes('roja') || textoLower.includes('granizo')) {
                        claseColor = 'alerta-roja';
                        icono = '🚨';
                    }

                    contenedor.innerHTML += `
                        <div class="smn-alerta-item ${claseColor}">
                            <div class="alerta-titulo">${icono} ${aviso.title}</div>
                            <div class="alerta-desc">${aviso.description}</div>
                            <div class="alerta-meta">
                                <span>Publicado: ${aviso.pubDate || 'Reciente'}</span>
                                <span>ID: ${aviso.id}</span>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error('Error al conectar con el Worker:', error);
                statusBadge.innerText = 'FALLO CONEXIÓN';
                statusBadge.style.color = '#ef4444';

                contenedor.innerHTML = `
                    <div class="smn-alerta-item alerta-roja">
                        <div class="alerta-titulo" style="color: #ef4444;">❌ Fallo de Conexión (${error.message})</div>
                        <div class="alerta-desc">
                            No se pudo contactar a la URL del Worker[cite: 7]. Asegúrate de:<br>
                            1. Haber ejecutado el script actualizado en Cloudflare Worker con cabeceras <code>CORS_HEADERS</code>.<br>
                            2. Reemplazar <code>WORKER_URL</code> en este HTML por tu dirección real.
                        </div>
                    </div>
                `;
            }
        }

        // Ejecutar al iniciar
        cargarAlertasSMNWorker();

        // Refresco de datos automático cada 5 minutos
        setInterval(cargarAlertasSMNWorker, 300000);
    </script>
</body>
</html>
