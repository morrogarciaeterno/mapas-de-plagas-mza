<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Satelital y Nubosidad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    background: #f0f0f0;
}
#map{
    width:100%;
    height:100vh;
}
.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    background:rgba(0,0,0,.85);
    padding:10px;
    border-radius:12px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    max-width:95%;
}
button{
    border:none;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}
input{
    padding:8px;
    border-radius:6px;
    border:none;
    width:220px;
}
.nubes{background:#2563eb;}
.gps{background:#16a34a;}
.buscar{background:#7c3aed;}

/* Panel flotante de estado del cielo y nubes */
.info-clima {
    position: absolute;
    top: 70px;
    left: 10px;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-family: sans-serif;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<div class="panel">
    <button id="btnNubes" class="nubes">☁️ Capa Nubes</button>
    <button id="btnGPS" class="gps">📍 GPS</button>
    <input id="direccion" type="text" placeholder="Dirección o localidad">
    <button id="btnBuscar" class="buscar">🔍 Buscar</button>
</div>

<!-- Cuadro con la información de la API del clima y nubes -->
<div id="infoClima" class="info-clima">☁️ Consultando estado del cielo...</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([-32.89,-68.84], 6);

// Mapa base claro
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// Fecha para la capa de la NASA
const fechaNubes = new Date(Date.now() - (3 * 24 * 60 * 60 * 1000)).toISOString().split('T')[0];

const nubes = L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/' + fechaNubes + '/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg', {
    opacity: 0.65, maxNativeZoom: 9, maxZoom: 18
});

document.getElementById("btnNubes").onclick = () => {
    if(map.hasLayer(nubes)) map.removeLayer(nubes); else nubes.addTo(map);
};

// Función simple de API para consultar nubosidad y viento real
async function consultarClimaAPI(lat, lon) {
    const caja = document.getElementById("infoClima");
    caja.innerHTML = "☁️ Consultando API de clima...";
    
    try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,cloud_cover,wind_speed_10m`);
        const data = await res.json();

        if(data && data.current) {
            const temp = data.current.temperature_2m;
            const nubesPct = data.current.cloud_cover;
            const viento = data.current.wind_speed_10m;

            caja.innerHTML = `
                <b>📊 Estado Actual:</b><br>
                🌡️ Temperatura: ${temp}°C<br>
                ☁️ Nubosidad: <b>${nubesPct}%</b><br>
                💨 Viento: ${viento} km/h
            `;
        }
    } catch(e) {
        caja.innerHTML = "⚠️ Error al consultar clima";
        console.error(e);
    }
}

let marcadorGPS;
function ubicarUsuario(){
    navigator.geolocation.getCurrentPosition((pos)=>{
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.flyTo([lat, lon], 10, { duration: 2 });
        if(marcadorGPS) map.removeLayer(marcadorGPS);
        marcadorGPS = L.marker([lat, lon]).addTo(map).bindPopup("📍 Tu ubicación").openPopup();
        
        consultarClimaAPI(lat, lon);
    }, (err)=>{
        consultarClimaAPI(-32.89, -68.84); // Default Mendoza
    });
}
document.getElementById("btnGPS").onclick = ubicarUsuario;

let marcadorBusqueda = null;
document.getElementById("btnBuscar").onclick = async ()=>{
    const texto = document.getElementById("direccion").value.trim();
    if(!texto) return alert("Ingrese una dirección");
    try{
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(texto));
        const datos = await res.json();
        if(datos.length === 0) return alert("No encontrada");
        const lat = parseFloat(datos[0].lat);
        const lon = parseFloat(datos[0].lon);
        map.flyTo([lat, lon], 13, { duration: 2 });
        if(marcadorBusqueda) map.removeLayer(marcadorBusqueda);
        marcadorBusqueda = L.marker([lat, lon]).addTo(map).bindPopup(datos[0].display_name).openPopup();
        
        consultarClimaAPI(lat, lon);
    }catch(e){ console.error(e); }
};

window.onload = ()=>{
    ubicarUsuario();
};
</script>

</body>
</html>
