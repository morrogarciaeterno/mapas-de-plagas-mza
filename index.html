<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Monitor Ambiental</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
}

#map{
    width:100%;
    height:100vh;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    background:rgba(0,0,0,.8);
    padding:10px;
    border-radius:10px;
}

button{
    border:none;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.luces{background:#ca8a04;}
.fuego{background:#dc2626;}
.lluvia{background:#0284c7;}
.gps{background:#22c55e;}

.activo{
    outline:3px solid white;
}
</style>
</head>
<body>

<div class="panel">
    <button id="btnLuces" class="luces">🌃 Luces</button>
    <button id="btnFuego" class="fuego">🔥 Fuego</button>
    <button id="btnLluvia" class="lluvia">🌧️ Lluvia</button>
    <button id="btnGPS" class="gps">📍 GPS</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-32.89,-68.84],6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

/* FECHA */
const fecha = new Date(
Date.now() - 86400000
).toISOString().split('T')[0];

/* LUCES NOCTURNAS */
const luces = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png',
{
    opacity:0.75,
    maxZoom:8
}
);

/* INCENDIOS */
const fuego = L.tileLayer(
`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_Thermal_Anomalies_375m_All/default/${fecha}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png`,
{
    opacity:0.9
}
);

/* LLUVIA */
const lluvia = L.tileLayer(
'https://tilecache.rainviewer.com/v2/radar/latest/256/{z}/{x}/{y}/2/1_1.png',
{
    opacity:0.7
}
);

/* BOTONES */

document.getElementById("btnLuces").onclick = function(){

    if(map.hasLayer(luces)){
        map.removeLayer(luces);
        this.classList.remove("activo");
    }else{
        luces.addTo(map);
        this.classList.add("activo");
    }

};

document.getElementById("btnFuego").onclick = function(){

    if(map.hasLayer(fuego)){
        map.removeLayer(fuego);
        this.classList.remove("activo");
    }else{
        fuego.addTo(map);
        this.classList.add("activo");
    }

};

document.getElementById("btnLluvia").onclick = function(){

    if(map.hasLayer(lluvia)){
        map.removeLayer(lluvia);
        this.classList.remove("activo");
    }else{
        lluvia.addTo(map);
        this.classList.add("activo");
    }

};

/* GPS */

let marcadorGPS;

document.getElementById("btnGPS").onclick = function(){

    navigator.geolocation.getCurrentPosition(

        function(pos){

            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            map.setView([lat,lon],11);

            if(marcadorGPS){
                map.removeLayer(marcadorGPS);
            }

            marcadorGPS = L.marker([lat,lon])
            .addTo(map)
            .bindPopup("📍 Tu ubicación")
            .openPopup();

        },

        function(){
            alert("No fue posible obtener la ubicación.");
        }

    );

};

</script>

</body>
</html>
