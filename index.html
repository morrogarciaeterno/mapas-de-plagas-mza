<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIIRS + Black Marble</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
padding:0;
height:100%;
}

#map{
height:100vh;
width:100%;
}

.panel{
position:absolute;
top:10px;
left:10px;
z-index:9999;
background:rgba(15,23,42,.95);
padding:10px;
border-radius:10px;
display:flex;
gap:8px;
}

button{
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
color:white;
}

#btnViirs{
background:#2563eb;
}

#btnLuces{
background:#ca8a04;
}

.activo{
outline:3px solid #22c55e;
}
</style>

</head>
<body>

<div class="panel">
<button id="btnViirs">🛰️ VIIRS</button>
<button id="btnLuces">🌃 Luces</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([-32.89,-68.84],6);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

const fecha = new Date(
Date.now() - 86400000
).toISOString().split("T")[0];

const viirs = L.tileLayer(
`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${fecha}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
{
opacity:0.8,
maxZoom:9
}
);

const blackMarble = L.tileLayer(
'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png',
{
opacity:0.9,
maxZoom:8
}
);

const btnViirs = document.getElementById("btnViirs");
const btnLuces = document.getElementById("btnLuces");

btnViirs.onclick = () => {

if(map.hasLayer(blackMarble)){
map.removeLayer(blackMarble);
btnLuces.classList.remove("activo");
}

if(map.hasLayer(viirs)){
map.removeLayer(viirs);
btnViirs.classList.remove("activo");
}else{
viirs.addTo(map);
btnViirs.classList.add("activo");
}

};

btnLuces.onclick = () => {

if(map.hasLayer(viirs)){
map.removeLayer(viirs);
btnViirs.classList.remove("activo");
}

if(map.hasLayer(blackMarble)){
map.removeLayer(blackMarble);
btnLuces.classList.remove("activo");
}else{
blackMarble.addTo(map);
btnLuces.classList.add("activo");
}

};

navigator.geolocation.getCurrentPosition(
(pos)=>{
const lat = pos.coords.latitude;
const lon = pos.coords.longitude;

map.setView([lat,lon],8);

L.marker([lat,lon])
.addTo(map)
.bindPopup("📍 Tu ubicación");
}
);

</script>

</body>
</html>
