<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    padding:10px;
    background:#f4f6f9;
    font-family:Arial,sans-serif;
}

#estado{
    text-align:center;
    color:#666;
    padding:10px;
    font-size:12px;
}

.sismo{
    background:#fff;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    border-left:5px solid #2563eb;
}

.sismo.mendoza{
    border-left-color:#dc2626;
    background:#fff5f5;
}

.encabezado{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.provincia{
    font-size:16px;
    font-weight:bold;
}

.magnitud{
    background:#2563eb;
    color:#fff;
    padding:4px 10px;
    border-radius:6px;
    font-weight:bold;
}

.mendoza .magnitud{
    background:#dc2626;
}

.dato{
    margin-top:4px;
    color:#555;
    font-size:13px;
}

a{
    color:#2563eb;
    text-decoration:none;
}
</style>

</head>

<body>

<div id="estado">Cargando sismos...</div>

<div id="contenedor"></div>

<script>

const API_URL =
[
  "https://",
  "inpres-proxy",
  ".elexpreso17.workers.dev"
].join("");

async function cargarSismos() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const xmlText = await response.text();

        const parser = new DOMParser();

        const xml = parser.parseFromString(
            xmlText,
            "text/xml"
        );

        const items = xml.querySelectorAll("item");

        let html = "";

        items.forEach(item => {

            const provincia =
                item.querySelector("prov")?.textContent || "";

            const fecha =
                item.querySelector("fecha")?.textContent || "";

            const hora =
                item.querySelector("hora")?.textContent || "";

            const magnitud =
                item.querySelector("mg")?.textContent || "";

            const profundidad =
                item.querySelector("prof")?.textContent || "";

            const latitud =
                item.querySelector("latitud")?.textContent || "";

            const longitud =
                item.querySelector("longitud")?.textContent || "";

            const id =
                item.querySelector("idSismo")?.textContent || "";

            const clase =
                provincia === "MENDOZA"
                ? "sismo mendoza"
                : "sismo";

            html += `
                <div class="${clase}">

                    <div class="encabezado">

                        <div class="provincia">
                            ${provincia}
                        </div>

                        <div class="magnitud">
                            M ${magnitud}
                        </div>

                    </div>

                    <div class="dato">
                        📅 ${fecha} ${hora}
                    </div>

                    <div class="dato">
                        📏 Profundidad: ${profundidad} km
                    </div>

                    <div class="dato">
                        📍 ${latitud}, ${longitud}
                    </div>

                    <div class="dato">
                        ID: ${id}
                    </div>

                </div>
            `;
        });

        document.getElementById("contenedor").innerHTML = html;

        document.getElementById("estado").innerHTML =
            "Actualizado: " +
            new Date().toLocaleString("es-AR");

    } catch(error) {

        console.error(error);

        document.getElementById("estado").innerHTML =
            "Error al cargar datos";

        document.getElementById("contenedor").innerHTML =
            "<div class='sismo'>No fue posible conectar con el servicio.<br><br>" +
            error +
            "</div>";
    }
}

cargarSismos();

setInterval(cargarSismos, 300000);

</script>

</body>
</html>
