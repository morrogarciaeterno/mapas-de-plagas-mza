
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Satelital</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    background: #f0f0f0;
}
#map{
    width:100%;
    height:100vh;
}
.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    background:rgba(0,0,0,.85);
    padding:10px;
    border-radius:12px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    max-width:95%;
}
button{
    border:none;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}
input{
    padding:8px;
    border-radius:6px;
    border:none;
    width:220px;
}
.nubes{background:#2563eb;}
.luces{background:#ca8a04;}
.gps{background:#16a34a;}
.buscar{background:#7c3aed;}

/* Etiqueta de última actualización bien visible */
.info-actualizacion {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.85);
    color: #00ffcc;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family: monospace;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    pointer-events: none;
}
</style>
</head>
<body>

<div class="panel">
    <button id="btnNubes" class="nubes">☁️ Nubes</button>
    <button id="btnLuces" class="luces">🌃 Luces</button>
    <button id="btnGPS" class="gps">📍 GPS</button>
    <input id="direccion" type="text" placeholder="Dirección o localidad">
    <button id="btnBuscar" class="buscar">🔍 Buscar</button>
</div>

<!-- Etiqueta de hora -->
<div id="infoActualizacion" class="info-actualizacion">🕒 Cargando hora...</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Inicializar mapa
const map = L.map('map').setView([-32.89,-68.84], 6);

// Capas base Día y Noche
const mapBaseDia = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
});

const mapBaseNoche = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© CartoDB'
});

// Evaluar si es de día (6:00 AM a 8:30 PM)
function esDeDia() {
    const ahora = new Date();
    const tiempoDecimal = ahora.getHours() + (ahora.getMinutes() / 60);
    return tiempoDecimal >= 6 && tiempoDecimal < 20.5;
}

// Aplicar mapa base según corresponda
if (esDeDia()) {
    mapBaseDia.addTo(map);
} else {
    mapBaseNoche.addTo(map);
}

// Mostrar hora de actualización en pantalla
function mostrarUltimaActualizacion() {
    const ahora = new Date();
    const horas = String(ahora.getHours()).padStart(2, '0');
    const minutos = String(ahora.getMinutes()).padStart(2, '0');
    const segundos = String(ahora.getSeconds()).padStart(2, '0');
    
    const elemento = document.getElementById("infoActualizacion");
    if(elemento) {
        elemento.innerText = `🕒 Actualizado: ${horas}:${minutos}:${segundos}`;
    }
}

// Fechas dinámicas para la NASA
const fechaNubes = new Date(Date.now() - (3 * 24 * 60 * 60 * 1000)).toISOString().split('T')[0];

const nubes = L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/' + fechaNubes + '/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg', {
    opacity: 0.65, maxNativeZoom: 9, maxZoom: 18
});

const luces = L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png', {
    opacity: 0.75, maxNativeZoom: 8, maxZoom: 18
});

// Botones de capas
document.getElementById("btnNubes").onclick = () => {
    if(map.hasLayer(nubes)) map.removeLayer(nubes); else nubes.addTo(map);
};
document.getElementById("btnLuces").onclick = () => {
    if(map.hasLayer(luces)) map.removeLayer(luces); else luces.addTo(map);
};

// GPS
let marcadorGPS;
function ubicarUsuario(){
    navigator.geolocation.getCurrentPosition((pos)=>{
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.flyTo([lat, lon], 10, { duration: 2 });
        if(marcadorGPS) map.removeLayer(marcadorGPS);
        marcadorGPS = L.marker([lat, lon]).addTo(map).bindPopup("📍 Tu ubicación").openPopup();
    });
}
document.getElementById("btnGPS").onclick = ubicarUsuario;

// Buscador
let marcadorBusqueda = null;
document.getElementById("btnBuscar").onclick = async ()=>{
    const texto = document.getElementById("direccion").value.trim();
    if(!texto) return alert("Ingrese una dirección");
    try{
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(texto));
        const datos = await res.json();
        if(datos.length === 0) return alert("No encontrada");
        const lat = parseFloat(datos[0].lat);
        const lon = parseFloat(datos[0].lon);
        map.flyTo([lat, lon], 13, { duration: 2 });
        if(marcadorBusqueda) map.removeLayer(marcadorBusqueda);
        marcadorBusqueda = L.marker([lat, lon]).addTo(map).bindPopup(datos[0].display_name).openPopup();
    }catch(e){ console.error(e); }
};

window.onload = ()=>{
    ubicarUsuario();
    mostrarUltimaActualizacion();
};
</script>

</body>
</html>
