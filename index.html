<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa Pasos Internacionales</title>

<link rel="stylesheet"
href="httpsst/leaflet.css

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
}

#map{
    width:100%;
    height:100vh;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    background:white;
    padding:10px;
    border-radius:10px;
    font-family:Arial,sans-serif;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
}

</style>

</head>
<body>

<div class="panel">
    <b>Pasos Internacionales</b><br>
    <span id="estado">Cargando...</span>
</div>

<div id="map"></div>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

const API =
"https://" +
"pasos-proxy" +
".elexpreso17.workers.dev";

const map = L.map("map").setView(
    [-38,-65],
    4
);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 18,
        attribution: "OpenStreetMap"
    }
).addTo(map);

async function cargarPasos(){

    try{

        const response = await fetch(API);

        const pasos = await response.json();

        document.getElementById("estado").innerHTML =
            pasos.length + " pasos cargados";

        pasos.forEach(paso => {

            const color =
                paso.estado_prioridad === "ABIERTO"
                ? "#22c55e"
                : "#ef4444";

            L.circleMarker(
                [paso.latitud, paso.longitud],
                {
                    radius: 7,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.8,
                    weight: 2
                }
            )
            .addTo(map)
            .bindPopup(
                "<b>" + paso.nombre_paso + "</b><br>" +
                "Estado: " + paso.estado_prioridad + "<br>" +
                "Provincia: " + paso.provincia + "<br>" +
                "País: " + paso.pais + "<br>" +
                "Latitud: " + paso.latitud + "<br>" +
                "Longitud: " + paso.longitud
            );

        });

    }
    catch(error){

        document.getElementById("estado").innerHTML =
            "Error al cargar";

        console.error(error);

    }

}

cargarPasos();

</script>

</body>
</html>
