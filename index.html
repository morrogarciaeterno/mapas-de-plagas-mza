<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIIRS NASA</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
}

button{
    padding:10px 15px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="panel">
    <button id="btn">🛰️ Satélite VIIRS</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Crear mapa
const map = L.map('map').setView([-34.6,-68.5],5);

// Base OSM
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

// Marca Mendoza
L.marker([-32.89,-68.84])
.addTo(map)
.bindPopup('Mendoza')
.openPopup();

document.getElementById('btn').onclick = () => {
    alert('Leaflet funciona correctamente');
};

</script>

</body>
</html>
