<!DOCTYPE html>
<html>
<head>
  <title>Mapa de Riesgo de Plagas - Interactivo</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-bar { background: #333; color: white; padding: 10px; font-size: 0.9rem; text-align: center; }
    #map { flex-grow: 1; width: 100%; background: #f0f0f0; }
  </style>
</head>
<body>
  <div id="info-bar">💡 Arrastra el marcador a cualquier región para consultar el clima y estado en tiempo real.</div>
  <div id="map"></div>

  <script>
    // 1. Coordenadas iniciales (Valle de Uco)
    var latInicial = -33.65;
    var lonInicial = -69.20;

    // 2. Inicializar el mapa
    var map = L.map('map').setView([latInicial, lonInicial], 10);

    // 3. Capa base con MapTiler
    L.tileLayer('https://api.maptiler.com/maps/outdoor-v4/{z}/{x}/{y}.png?key=pA0O2I617xTzrBmgMIUT', {
      maxZoom: 18,
      attribution: '&copy; MapTiler &copy; OpenStreetMap contributors'
    }).addTo(map);

    // 4. Crear un marcador ARRASTRABLE (draggable: true)
    var marker = L.marker([latInicial, lonInicial], {
      draggable: true
    }).addTo(map);

    // Función principal para consultar clima y calcular estado según la posición
    function actualizarDatosUbicacion(lat, lon) {
      // Consultar clima en tiempo real para las nuevas coordenadas con Open-Meteo
      var urlClimaAPI = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,relative_humidity_2m";

      fetch(urlClimaAPI)
        .then(response => response.json())
        .then(climaData => {
          var tempActual = "22.5";
          var humActual = "45.0";

          if (climaData && climaData.current) {
            tempActual = climaData.current.temperature_2m;
            humActual = climaData.current.relative_humidity_2m;
          }

          // Leemos el NDVI base de GitHub como referencia general del estudio
          var urlNDVI = "https://raw.githubusercontent.com/morrogarciaeterno/mapas-de-plagas-mza/refs/heads/main/NDVI_Mendoza.csv";

          Papa.parse(urlNDVI, {
            download: true,
            header: true,
            complete: function(ndviResults) {
              var ndviRow = ndviResults.data[0] || {};
              var ndviValue = parseFloat(ndviRow.NDVI) || 0.070;

              // Lógica de colores y riesgo
              var riesgo = "Bajo (Saludable)";
              if (ndviValue < 0.4) {
                riesgo = "Alto (Estrés / Suelo)";
              } else if (ndviValue < 0.6) {
                riesgo = "Moderado";
              }

              var popupContent = 
                "<b>Ubicación:</b> " + lat.toFixed(4) + ", " + lon.toFixed(4) + "<br>" +
                "<b>Riesgo:</b> " + riesgo +
                "<br><b>NDVI Est.:</b> " + ndviValue.toFixed(3) +
                "<br><b>Temperatura:</b> " + tempActual + " °C" +
                "<br><b>Humedad:</b> " + humActual + " %";

              marker.setPopupContent(popupContent);
              marker.openPopup();
            }
          });
        })
        .catch(error => {
          console.error("Error al consultar la API del clima:", error);
        });
    }

    // Cargar datos por defecto al iniciar
    actualizarDatosUbicacion(latInicial, lonInicial);

    // Evento que se ejecuta cuando SUeltas el marcador en otra parte del mapa
    marker.on('dragend', function(event) {
      var posicion = marker.getLatLng();
      actualizarDatosUbicacion(posicion.lat, posicion.lng);
    });
  </script>
</body>
</html>
