<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidrometría Mendoza</title>

<style>

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#f4f7fb;
}

header{
    background:#0b63ce;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#0b63ce;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 20px;
    cursor:pointer;
}

button:hover{
    background:#084da3;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.nombre{
    color:#555;
    font-size:14px;
    margin-bottom:10px;
}

.valor{
    font-size:32px;
    font-weight:bold;
    color:#0b63ce;
}

.fecha{
    margin-top:10px;
    font-size:12px;
    color:#777;
}

pre{
    background:#111;
    color:#00ff88;
    padding:15px;
    border-radius:10px;
    overflow:auto;
    margin-top:20px;
}

</style>
</head>

<header>
    <h1>🌊 Hidrometría Argentina</h1>
    <p>Datos en tiempo real desde SNIH</p>
</header>
