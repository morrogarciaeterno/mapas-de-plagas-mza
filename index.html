<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Estaciones Hidrometeorológicas</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar el mapa centrado en Mendoza
        const map = L.map('map').setView([-32.8895, -68.8458], 7);

        // Capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Aquí debes pegar tu objeto GeoJSON completo
        const geojsonData = {
            "type": "FeatureCollection",
            "features": [
                // Ejemplo de estructura, reemplaza con tus datos reales
                {
                    "type": "Feature",
                    "geometry": { 
                        "type": "Point", 
                        "coordinates": [-68.8458, -32.8895] 
                    },
                    "properties": { 
                        "nombre": "Estación Mendoza", 
                        "distrito": "Mendoza", 
                        "tipo": "M", 
                        "propietario": "Ejemplo" 
                    }
                }
            ]
        };

        // Función para agregar el GeoJSON al mapa con popups
        L.geoJSON(geojsonData, {
            onEachFeature: function (feature, layer) {
                if (feature.properties) {
                    const name = feature.properties.nombre || "Estación";
                    const district = feature.properties.distrito || "N/A";
                    const type = feature.properties.tipo === 'H' ? 'Hidrológica' : 'Meteorológica';
                    const owner = feature.properties.propietario || "N/A";

                    layer.bindPopup(`
                        <strong>${name}</strong><br>
                        <b>Provincia:</b> ${district}<br>
                        <b>Tipo:</b> ${type}<br>
                        <b>Propietario:</b> ${owner}
                    `);
                }
            }
        }).addTo(map);
    </script>
</body>
</html>
