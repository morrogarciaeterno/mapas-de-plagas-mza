<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Territoria - Mapa e Hidrometría SNIH</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    :root {
        --bg: #070a14;
        --card-bg: #0e1526;
        --card-inner: #162035;
        --accent: #38bdf8;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: #1e293b;
    }
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text-main);
        padding: 20px;
    }
    header{
        background: linear-gradient(135deg, #0e1526 0%, #0d2137 100%);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 20px;
        text-align: center;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        margin-bottom: 20px;
    }
    header h1{
        font-size: 1.3rem;
        font-weight: 800;
    }
    header p{
        color: var(--accent);
        font-size: 0.75rem;
        margin-top: 4px;
    }
    .container{
        max-width: 1200px;
        margin: auto;
    }
    .layout-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    @media(max-width: 900px) {
        .layout-grid { grid-template-columns: 1fr; }
    }
    .panel {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #map {
        height: 550px;
        border-radius: 12px;
        border: 1px solid var(--border);
        z-index: 1;
        cursor: crosshair;
    }
    .search-box{
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    select, input {
        flex: 1;
        padding: 10px 12px;
        background: var(--card-inner);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-main);
        font-size: 0.85rem;
        outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    button{
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #000;
        font-weight: 800;
        cursor: pointer;
        font-size: 0.8rem;
    }
    button:hover{ opacity: 0.9; }
    .cards{
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-top: 15px;
    }
    .card{
        background: var(--card-inner);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
    }
    .nombre{
        color: var(--text-muted);
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
    }
    .valor{
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--accent);
        margin-top: 4px;
    }
    .unidad{
        color: var(--text-muted);
        font-size: 0.68rem;
        margin-top: 2px;
    }
    .form-manual {
        margin-top: 15px;
        background: var(--card-inner);
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
    }
    .form-manual h4 { font-size: 0.8rem; color: var(--accent); margin-bottom: 8px; }
    .form-manual input { width: 100%; margin-bottom: 8px; }
    .btn-secundario {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.75rem;
        padding: 8px 14px;
        margin-top: 15px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
    }
    .btn-secundario:hover { border-color: var(--accent); color: var(--accent); }
    .json-box{
        display: none;
        margin-top: 15px;
        background: #02040a;
        border: 1px solid var(--border);
        color: #22c55e;
        border-radius: 12px;
        padding: 15px;
        overflow: auto;
        max-height: 200px;
        font-family: monospace;
        font-size: 0.7rem;
    }
    .loading{
        text-align: center;
        font-size: 0.8rem;
        color: var(--accent);
        padding: 20px;
        grid-column: 1 / -1;
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1 id="tituloEstacion">🌊 Territoria - Mapa y Monitoreo Hídrico</h1>
        <p id="instruccionMapa">Hacé clic en los puntos celestes del mapa o cargá una estación nueva abajo.</p>
    </header>

    <div class="layout-grid">
        <!-- COLUMNA IZQUIERDA: MAPA -->
        <div class="panel">
            <h3 style="font-size: 0.85rem; margin-bottom: 10px; color: var(--text-main);">📍 Mapa de Estaciones y Cuencas</h3>
            <div id="map"></div>
            
            <div class="form-manual">
                <h4 id="formTitulo">➕ Cargar Estación Interactiva</h4>
                <input id="nuevoId" placeholder="ID (ej: 19104)">
                <input id="nuevoNombre" placeholder="Nombre (ej: Paso Pehuenche)">
                <input id="nuevaRed" placeholder="Ubicación / Red (ej: Río Grande, Mendoza)">
                <div style="display: flex; gap: 8px;">
                    <button onclick="prepararModoUbicacion()" style="flex: 2; background: #22c55e; color: #000;">1. Guardar y Ubicar en Mapa</button>
                    <button onclick="cancelarEdicion()" id="btnCancelar" style="flex: 1; background: #ef4444; color: #fff; display:none;">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: DATOS Y CONTROLES -->
        <div class="panel">
            <div class="search-box">
                <select id="id" onchange="consultar()">
                    <!-- Se llena dinámicamente -->
                </select>
                <button onclick="consultar()">Actualizar</button>
                <button onclick="cargarEstacionParaEditar()" style="background: #eab308; color: #000;" title="Editar estación seleccionada">✏️ Editar</button>
            </div>

            <div id="infoDetalle" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px;">
                Información de la red y ubicación...
            </div>

            <div id="resultado" class="cards">
                <div class="loading">Seleccioná una estación del mapa o del selector.</div>
            </div>

            <button class="btn-secundario" onclick="toggleJson()">Ver / Ocultar Depuración JSON</button>
            <div id="jsonContainer" class="json-box">
                <pre id="json">// Respuesta JSON...</pre>
            </div>
        </div>
    </div>
</div>
