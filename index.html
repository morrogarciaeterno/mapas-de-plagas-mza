<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico OGC - Telemetría y Datos Geoespaciales</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wide text-emerald-400">Visor de Capas Geoespaciales (OGC / WMS)</h1>
        <span class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full border border-slate-600">Conexión Directa Servidor WMS</span>
    </header>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Panel Lateral de Control -->
        <aside class="w-80 bg-slate-800/90 border-r border-slate-700 p-5 flex flex-col gap-5 z-10 overflow-y-auto">
            <div>
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-2">Capas Disponibles</h2>
                <p class="text-xs text-slate-400 mb-4">Seleccioná una capa institucional WMS para superponer en el mapa en tiempo real.</p>
            </div>

            <!-- Selector de Capas -->
            <div class="flex flex-col gap-3">
                <label class="flex items-center gap-3 p-3 rounded-lg bg-slate-700/50 hover:bg-slate-700 cursor-pointer border border-slate-600 transition">
                    <input type="radio" name="layer" value="none" checked class="text-emerald-500 focus:ring-emerald-400">
                    <span class="text-sm font-medium">Ninguna (Mapa Base limpio)</span>
                </label>

                <!-- Ejemplo de Capa WMS Institucional (Modificable según el endpoint del GeoServer objetivo) -->
                <label class="flex items-center gap-3 p-3 rounded-lg bg-slate-700/50 hover:bg-slate-700 cursor-pointer border border-slate-600 transition">
                    <input type="radio" name="layer" value="focos_calor" class="text-emerald-500 focus:ring-emerald-400">
                    <div class="text-sm">
                        <span class="font-medium block">Monitoreo / Cobertura Geo</span>
                        <span class="text-xs text-slate-400">Servicio WMS OGC Estándar</span>
                    </div>
                </label>
            </div>

            <div class="mt-auto pt-4 border-t border-slate-700 text-xs text-slate-400">
                <p>Estado del servicio: <span id="status" class="text-emerald-400 font-semibold">Listo</span></p>
            </div>
        </aside>

        <!-- Mapa Leaflet -->
        <main class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Inicializar el mapa centrado en Cuyo / Argentina
        const map = L.map('map').setView([-32.8908, -68.8272], 6);

        // Capa base de OpenStreetMap oscura/neutra
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        let wmsLayer = null;

        // Control de selección de capas WMS
        const radios = document.querySelectorAll('input[type=radio][name="layer"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const statusEl = document.getElementById('status');
                
                // Remover capa anterior si existe
                if (wmsLayer) {
                    map.removeLayer(wmsLayer);
                    wmsLayer = null;
                }

                if (e.target.value === 'focos_calor') {
                    statusEl.innerText = 'Conectando a WMS...';
                    
                    // URL de ejemplo conectándose a un GeoServer OGC estándar público
                    wmsLayer = L.tileLayer.wms('https://geotematico01.conae.gov.ar/geoserver/wms?', {
                        layers: 'cite:v_visor_cobertura', // Reemplazable por la capa exacta del servidor
                        format: 'image/png',
                        transparent: true,
                        version: '1.1.0',
                        attribution: 'CONAE / GeoServer WMS'
                    }).addTo(map);

                    statusEl.innerText = 'Capa WMS Activa';
                } else {
                    statusEl.innerText = 'Listo';
                }
            });
        });
    </script>
</body>
</html>
